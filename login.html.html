<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In — LexVault</title>
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,800;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/variables.css"/>
  <link rel="stylesheet" href="../css/base.css"/>
  <link rel="stylesheet" href="../css/nav.css"/>
  <link rel="stylesheet" href="../css/footer.css"/>
  <link rel="stylesheet" href="../css/auth.css"/>
</head>
<body>
  <header class="nav-wrapper" id="navbar">
    <nav class="nav-inner">
      <a href="../index.html" class="logo">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none"><rect width="28" height="28" rx="6" fill="var(--gold)"/><path d="M7 8h14M7 12h10M7 16h12M7 20h8" stroke="#1a1208" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Lex<strong>Vault</strong></span>
      </a>
      <ul class="nav-links">
        <li><a href="../index.html">Home</a></li>
        <li><a href="catalog.html">Catalog</a></li>
      </ul>
      <div class="nav-actions">
        <a href="register.html" class="btn-primary">Register</a>
      </div>
      <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
    </nav>
    <div class="mobile-menu" id="mobileMenu">
      <a href="../index.html">Home</a>
      <a href="catalog.html">Catalog</a>
      <a href="register.html" class="btn-primary">Register</a>
    </div>
  </header>

  <section class="auth-section">
    <div class="auth-card">
      <div class="auth-logo">
        <svg width="40" height="40" viewBox="0 0 28 28" fill="none"><rect width="28" height="28" rx="6" fill="var(--gold)"/><path d="M7 8h14M7 12h10M7 16h12M7 20h8" stroke="#1a1208" stroke-width="2" stroke-linecap="round"/></svg>
        <span>LexVault</span>
      </div>
      <h1>Welcome Back</h1>
      <p class="auth-sub">Sign in to access your legal eBook library</p>
      <div id="loginAlert"></div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="loginEmail" placeholder="you@lawfirm.com" required/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <div style="position:relative;">
          <input type="password" id="loginPass" placeholder="••••••••" required/>
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;">
        <label style="display:flex;align-items:center;gap:8px;font-size:0.875rem;color:var(--text-muted);">
          <input type="checkbox" style="width:auto;"/> Remember me
        </label>
        <a href="forgot.html" style="font-size:0.875rem;color:var(--gold);">Forgot password?</a>
      </div>
      <button class="btn-primary btn-large" style="width:100%;justify-content:center;" onclick="handleLogin()">Sign In</button>
      <p class="auth-switch">Don't have an account? <a href="register.html">Create one free</a></p>
    </div>
  </section>

  <script src="../js/nav.js"></script>
  <script>
    function handleLogin() {
      const email = document.getElementById('loginEmail').value;
      const pass  = document.getElementById('loginPass').value;
      const alert = document.getElementById('loginAlert');
      if (!email || !pass) {
        alert.innerHTML = '<div class="alert alert-error">Please enter your email and password.</div>';
        return;
      }
      // 🔧 Connect to your backend auth here (Firebase, Supabase, custom API, etc.)
      alert.innerHTML = '<div class="alert alert-info">🔄 Signing you in… (connect your auth backend in js/auth.js)</div>';
      setTimeout(() => { window.location.href = 'dashboard.html'; }, 1500);
    }
  </script>
</body>
</html>
